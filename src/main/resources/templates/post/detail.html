<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${posting.title}">글 조회</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav>
    <span class="nav-brand">Community</span>
    <div class="nav-links">
        <span th:text="${session.loginUser.nickname}"></span>
        <a th:href="@{/post/list}">전체 글</a>
        <a th:href="@{/post/popular}">인기 글</a>
        <a th:href="@{/post/write}" class="btn-write">글쓰기</a>
        <a th:href="@{/user/logout}" class="btn-logout">로그아웃</a>
    </div>
</nav>

<div class="detail-wrap">
    <a th:href="@{/post/list(page=${page})}" class="back-link">목록으로</a>

    <div class="detail-header">
        <h2 th:text="${posting.title}"></h2>
        <div class="detail-meta">
            <span>조회수 <span th:text="${posting.viewCount}"></span></span>
            <span th:text="${posting.formattedCreatedAt}"></span>
        </div>
    </div>

    <div class="detail-content" th:text="${posting.content}"></div>

    <div class="detail-actions" th:if="${session.loginUser != null and session.loginUser.id == posting.authorId}">
        <form method="get" th:action="@{/post/{id}/update(id=${posting.id})}">
            <button type="submit" class="btn-secondary">수정</button>
        </form>
        <form method="get" th:action="@{/post/{id}/delete(id=${posting.id})}">
            <button type="submit" class="btn-danger">삭제</button>
        </form>
    </div>
</div>

<div class="comment-section">
    <h3>댓글 <span th:text="${commentCount}"></span>개</h3>

    <div th:each="cwr:${comments}" class="comment-item">

        <div class="comment-body">
            <div class="comment-main">
                 <span class="comment-text" th:text="${cwr.originComment.comments}"></span>
                 <span class="comment-meta" th:text="${cwr.originComment.formattedCreatedAt}"></span>
            </div>
            <form th:action="@{/comment/{id}/delete(id=${cwr.originComment.id})}" method="post"
                  th:if="${session.loginUser != null and session.loginUser.id == cwr.originComment.authorId}">
                <input type="hidden" name="postId" th:value="${posting.id}">
                <button type="submit">삭제</button>
            </form>
            <!-- 대댓글 토글 버튼 -->
            <button class="btn-reply-toggle"
                    th:attr="data-id=${cwr.originComment.id}"
                    onclick="toggleReply(this)">
                답글
            </button>
        </div>

        <!-- 대댓글 목록 -->
        <div class="reply-list">
            <div th:each="reply:${cwr.replies}" class="reply-item">
                <div class="comment-main">
                      <span class="comment-text" th:text="${reply.comments}"></span>
                     <span class="comment-meta" th:text="${reply.formattedCreatedAt}"></span>
                </div>
                <form th:action="@{/comment/{id}/delete(id=${reply.id})}" method="post"
                      th:if="${session.loginUser != null and session.loginUser.id == reply.authorId}">
                    <input type="hidden" name="postId" th:value="${posting.id}">
                    <button type="submit">삭제</button>
                </form>
            </div>
        </div>

        <!-- 대댓글 작성 폼 -->
        <div class="reply-form" th:id="'reply-' + ${cwr.originComment.id}" style="display:none;">
            <form th:action="@{/comment/write}" method="post">
                <input type="hidden" name="postId" th:value="${posting.id}">
                <input type="hidden" name="parentId" th:value="${cwr.originComment.id}">
                <input type="text" name="comments" placeholder="대댓글 입력" class="reply-input-margin">
                <button type="submit">작성</button>
            </form>
        </div>
    </div>

    <div th:if="${session.loginUser!=null}" class="comment-form">
        <form th:action="@{/comment/write}" method="post">
            <input type="hidden" name="postId" th:value="${posting.id}">
            <textarea name="comments" placeholder="댓글을 입력하세요"></textarea>
            <button type="submit" class="btn-primary">댓글 작성</button>
        </form>
    </div>
</div>

<script>
    function toggleReply(btn) {
        const id = btn.getAttribute('data-id');
        const el = document.getElementById('reply-' + id);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
</script>

</body>
</html>
