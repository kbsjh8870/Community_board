<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav>
    <span class="nav-brand">Community</span>
    <div class="nav-links">
        <a th:href="@{/post/list}">전체 글</a>
        <a th:href="@{/user/logout}" class="btn-logout">로그아웃</a>
    </div>
</nav>

<div class="form-wrap wide">
    <a th:href="@{/post/list}" class="back-link">목록으로</a>
    <h2>글 수정</h2>
    <form method="post" th:action="@{/post/{id}/update(id=${updatePost.id})}">
        <div class="form-group">
            <label>제목</label>
            <input type="text" name="title" th:value="${updatePost.title}">
        </div>
        <div class="form-group">
            <label>내용</label>
            <textarea name="content" th:text="${updatePost.content}"></textarea>
        </div>
        <button type="submit" class="btn-primary">수정</button>
    </form>
</div>

</body>
</html>
