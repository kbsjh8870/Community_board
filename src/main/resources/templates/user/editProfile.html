<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 정보 수정</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav>
    <a th:href="@{/post/list}" class="nav-brand">Community</a>
    <div class="nav-links">
        <a th:href="@{/user/{id}/profile(id=${session.loginUser.id})}"
           class="nav-nickname" th:text="${session.loginUser.nickname}"></a>
        <a th:href="@{/post/list}">전체 글</a>
        <a th:href="@{/post/popular}">인기 글</a>
        <a th:href="@{/post/write}" class="btn-write">글쓰기</a>
        <a th:href="@{/user/logout}" class="btn-logout">로그아웃</a>
    </div>
</nav>

<div class="form-wrap">
    <a th:href="@{/user/{id}/profile(id=${user.id})}" class="back-link">프로필로</a>
    <h2>내 정보 수정</h2>

    <div th:if="${errorMsg}" class="error-msg">
        <span th:text="${errorMsg}"></span>
    </div>

    <form th:action="@{/user/{id}/editProfile(id=${user.id})}" th:object="${user}" method="post">

        <div class="form-group">
            <label>아이디</label>
            <input type="text" th:value="*{username}" disabled>
        </div>

        <div class="form-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}">
        </div>

        <hr style="border-color: var(--border); margin: 24px 0;">

        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" name="currentPW" placeholder="기존 비밀번호를 입력하세요">
        </div>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" name="newPW" placeholder="새 비밀번호">
        </div>

        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" name="confirmPW" placeholder="새 비밀번호를 다시 입력하세요">
        </div>

        <div class="detail-actions" style="margin-top: 24px;">
            <a th:href="@{/user/{id}/profile(id=${user.id})}" class="btn btn-secondary">취소</a>
            <button type="submit" class="btn-primary">수정 완료</button>
        </div>

    </form>
</div>

</body>
</html>
