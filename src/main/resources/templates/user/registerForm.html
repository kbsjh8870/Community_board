<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="form-wrap">
    <h2>회원가입</h2>
    <form method="post" th:action="@{/user/register}">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="username" placeholder="아이디 입력">
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="비밀번호 입력">
        </div>
        <div class="form-group">
            <label>닉네임</label>
            <input type="text" name="nickname" placeholder="닉네임 입력">
        </div>
        <button type="submit" class="btn-primary" style="width:100%">회원가입</button>
    </form>
    <div class="form-footer" style="margin-top:16px">
        이미 계정이 있으신가요? <a th:href="@{/user/login}">로그인</a>
    </div>
</div>

</body>
</html>
